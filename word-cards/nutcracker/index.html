<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dee2d7">
<title>Word cards</title>
<style>
 *,*::before,*::after{box-sizing:border-box}
 :root{
   --ground:#dee2d7;--ground-2:#cdd3c5;--on-ground:#262b2c;--soft:#5b6461;
   --rule:rgba(38,43,44,.16);--paper:#fcf9f2;--paper-2:#f1ecdf;--ink:#23282a;
   --ink-soft:#6a716e;--hair:rgba(35,40,42,.12);--rosette:#ad2f3b;--slate:#47606b;
   --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
   --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
   --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 }
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
   --ground:#15191b;--ground-2:#1e2427;--on-ground:#e4e8e3;--soft:#99a3a0;
   --rule:rgba(228,232,227,.18);--paper:#ece7db;--paper-2:#ddd7c8;--rosette:#bd3743;--slate:#40585f;}}
 :root[data-theme="dark"]{
   --ground:#15191b;--ground-2:#1e2427;--on-ground:#e4e8e3;--soft:#99a3a0;
   --rule:rgba(228,232,227,.18);--paper:#ece7db;--paper-2:#ddd7c8;--rosette:#bd3743;--slate:#40585f;}
 body{margin:0;background:var(--ground);color:var(--on-ground);font-family:var(--ui);
      line-height:1.55;-webkit-font-smoothing:antialiased;padding:26px 16px 104px}
 .wrap{max-width:560px;margin:0 auto}
 .crumb{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
 .crumb a{color:var(--soft);text-decoration:none}
 .crumb a:hover{color:var(--rosette)}
 h1{font-family:var(--display);font-size:clamp(28px,6vw,40px);margin:0 0 8px;letter-spacing:-.025em}
 .blurb{font-family:var(--serif);font-size:17px;margin:0 0 8px}
 .note{color:var(--soft);font-size:14.5px;margin:0 0 26px}

 /* ---------- contents, grouped by track ---------- */
 .toc{display:grid;gap:2px}
 .trk{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:baseline;
      padding:11px 0;border-top:1px solid var(--rule)}
 .trk .n{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700}
 .trk .ws{display:flex;flex-wrap:wrap;gap:6px 14px}
 .trk a{font-family:var(--display);font-size:18px;font-weight:600;color:var(--on-ground);
        text-decoration:none;border-bottom:2px solid transparent}
 .trk a:hover,.trk a:focus-visible{color:var(--rosette);border-bottom-color:var(--rosette);outline:none}
 .start{display:inline-block;margin-top:24px;font:inherit;font-size:16px;font-weight:700;
        background:var(--rosette);color:#fff;border:0;border-radius:999px;padding:14px 26px;cursor:pointer}

 /* ---------- one word ---------- */
 .card{background:var(--paper);color:var(--ink);border-radius:22px;overflow:hidden;
       box-shadow:0 16px 40px rgba(0,0,0,.22)}
 .card img{display:block;width:100%;height:clamp(190px,32vh,300px);object-fit:cover;background:#111}
 .pad{padding:clamp(20px,5vw,28px)}
 .where{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);
        font-weight:700;margin:0 0 8px}
 .word{font-family:var(--display);font-size:clamp(36px,9vw,50px);font-weight:700;
       letter-spacing:-.025em;margin:0;line-height:1.02}
 .shift{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.1em;
        text-transform:uppercase;color:#fff;background:var(--slate);padding:4px 9px;border-radius:999px}
 h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:700;margin:22px 0 7px}
 .means{font-family:var(--display);font-size:clamp(19px,4.4vw,23px);font-weight:600;margin:0;line-height:1.34}
 ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
 .ex li{font-family:var(--serif);font-size:17px;line-height:1.45;padding-left:14px;
        border-left:2px solid var(--hair)}
 .ask{background:var(--paper-2);border-radius:14px;padding:14px 16px;border-left:3px solid var(--slate)}
 .ask h3{margin-top:0;color:var(--slate)}
 .ask li{font-size:16.5px;display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:start}
 .ask li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--slate);
                 margin-top:9px;margin-left:6px}

 .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:6px;
      align-items:center;background:#101315;padding:6px;border-radius:999px;
      box-shadow:0 10px 30px rgba(0,0,0,.42);z-index:10}
 .nav button{font:inherit;font-size:15px;font-weight:700;border:0;cursor:pointer;
             border-radius:999px;padding:12px 22px;background:var(--rosette);color:#fff}
 .nav button.ghost{background:transparent;color:#aab2ae;box-shadow:inset 0 0 0 2px #333c40}
 .nav .count{color:#aab2ae;font-size:13px;padding:0 8px;font-variant-numeric:tabular-nums}
 .nav[hidden]{display:none}

 footer{max-width:560px;margin:34px auto 0;font-size:12.5px;color:var(--soft);line-height:1.55}
 footer h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px;color:var(--soft)}
 footer ul{display:grid;gap:5px;margin:0 0 14px}
 footer a{color:var(--soft)}
 footer .note{border-top:1px solid var(--rule);padding-top:12px;margin:0}
 @media (prefers-reduced-motion:no-preference){
   .card,.toc{animation:rise .2s ease both}
   @keyframes rise{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>

<div class="wrap" id="stage"></div>
<footer id="credits"></footer>

<div class="nav" id="nav" hidden>
  <button class="ghost" id="home">Contents</button>
  <span class="count" id="count"></span>
  <button id="next">Next</button>
</div>

r Drosselmeyer had been to watch the Russian dancers, and could not stop saying how marvellous they were.", "A marvellous breakfast is not just a nice one — it is one you would tell somebody about."], "q": ["What is the most marvellous thing you have seen this year?", "Is a marvellous day better or worse than an all right day?"]}, {"w": "nincompoop", "t": 1, "at": "2:53", "pic": null, "means": "A silly, daft person. It is a very old-fashioned way of saying it, and it sounds funny on purpose.", "ex": ["“You're such a silly nincompoop,” said Fritz — and Clara said it straight back at him.", "If you put your wellies on the wrong feet you might call yourself a nincompoop."], "q": ["Is nincompoop a kind word or a rude one? How can you tell?", "Who said it first in the story — and who said it back?"]}, {"w": "waistcoat", "t": 1, "at": "6:03", "pic": null, "means": "A little jacket with no sleeves at all, with pockets on the front.", "ex": ["The tiny present came out of a pocket in Godfather Drosselmeyer's waistcoat.", "Peter Rabbit's father had a waistcoat too — you have heard about it on the other card."], "q": ["What is missing from a waistcoat that a coat has?", "What could you keep in a waistcoat pocket?"]}, {"w": "crack", "t": 2, "at": "1:23", "pic": null, "shift": true, "means": "Two meanings, and this story uses both. You crack a nut — that means break it open. But a crack is also a thin gap, like the line between two floorboards.", "ex": ["Fritz squeezed and squeezed to crack the hard nut, and broke the nutcracker's jaw instead.", "Later the mice all escaped down the thin gaps between the boards of the floor."], "q": ["Could you crack a nut in a crack? What is the difference?", "Find me a crack in this room."]}, {"w": "chimes", "t": 3, "at": "0:00", "pic": null, "means": "The bell sounds a clock makes to tell you the hour. One for one o'clock, two for two.", "ex": ["Clara woke at midnight, counting twelve chimes from the big clock in the hall.", "If a clock chimes eight times, it is telling you it is eight o'clock."], "q": ["How many chimes would the clock make at your bedtime?", "Could you count the chimes without looking at the clock?"]}, {"w": "ordinary", "t": 3, "at": "1:13", "pic": null, "means": "The normal, everyday kind. Nothing special about it at all.", "ex": ["They were not ordinary mice — they were dressed as soldiers, with swords and rifles.", "An ordinary Tuesday is one where nothing much happens."], "q": ["Point to something ordinary in this room, and something that isn't.", "Was the nutcracker an ordinary present?"]}, {"w": "rodent", "t": 3, "at": "1:20", "pic": null, "means": "An animal whose front teeth never stop growing, so it has to keep gnawing things to wear them down. Mice, rats and squirrels are all rodents.", "ex": ["The Mouse King is a rodent — a terrible one, with seven heads and a gold crown on each.", "Squirrels gnaw at nuts all day, because they are rodents and their teeth keep growing."], "q": ["Is a rabbit a rodent? Is a cat?", "What would happen to a rodent that never gnawed anything?"]}, {"w": "army", "t": 3, "at": "1:40", "pic": null, "means": "A huge crowd of soldiers who all fight together on the same side, with someone leading them.", "ex": ["Not one mouse, not ten — an army of mice, and facing them the nutcracker with his own army of dolls and tin soldiers.", "A whole army of ants marched across the path, every one following the one in front."], "q": ["Is one soldier an army? How many teddies would you need for an army of teddies?", "The nutcracker's army was made of toys — who was in the Mouse King's army?"]}, {"w": "vanished", "t": 3, "at": "3:38", "pic": null, "means": "Gone all at once, the way things go in magic. Not walked away — just gone.", "ex": ["In one moment the whole mouse army had vanished — every last one, gone down between the boards.", "If you shut your eyes and I hid the spoon, you would say it had vanished."], "q": ["What would you like to be able to make vanish?", "Is something that has vanished still somewhere?"]}, {"w": "crept", "t": 4, "at": "1:00", "pic": null, "means": "Moved so quietly that nobody could hear you coming.", "ex": ["The Mouse Queen crept past seven sleeping cats and climbed onto the princess's bed.", "You crept downstairs on Christmas morning so you wouldn't wake anyone."], "q": ["Can you creep across this room without me hearing you?", "Why did the Mouse Queen creep instead of running?"]}, {"w": "furious", "t": 4, "at": "1:11", "pic": null, "means": "So angry you can hardly get the words out.", "ex": ["The king was furious when he found the mice had eaten his Christmas lunch.", "The Mouse Queen was furious too — about her children. They were both furious about the same sort of thing."], "q": ["What is the last thing that made you furious?", "Is furious a bit cross, or very cross?"]}, {"w": "summoned", "t": 4, "at": "1:11", "pic": null, "means": "Sent for somebody and made them come, whether they wanted to or not.", "ex": ["The king did not ask Drosselmeyer to come. He summoned him.", "Both times somebody is summoned in this story, it is a king doing it."], "q": ["Who could summon you? Could you summon anybody?", "What is the difference between asking somebody to come and summoning them?"]}, {"w": "revenge", "t": 4, "at": "1:52", "pic": null, "means": "Hurting somebody back because they hurt you first.", "ex": ["The Mouse Queen climbed onto the queen's table and promised revenge, right in her face.", "Her revenge was a spell that made the princess hideous."], "q": ["Does getting revenge ever make it better?", "Who did the Mouse Queen want revenge on, and why?"]}, {"w": "fierce", "t": 4, "at": "2:23", "pic": null, "means": "Wild and a bit frightening, and ready for a fight.", "ex": ["Seven fierce cats were set to guard the princess's bed — and then they fell asleep and were no use at all.", "A fierce dog barks and pulls at its lead. A gentle one does not."], "q": ["What is the fiercest animal you can think of? What is the least fierce?", "Were the cats still fierce while they were asleep?"]}, {"w": "spell", "t": 4, "at": "2:51", "pic": null, "shift": true, "means": "You know how to spell your name — that means putting the letters in the right order. But a spell is also magic words that change something. The two have nothing to do with each other.", "ex": ["The Mouse Queen said an evil spell, and in the morning the princess's face had turned hideous.", "You can spell C-A-T. That is a different kind of spelling altogether."], "q": ["Can you spell your name? Was that a magic spell?", "What would you want a magic spell to do?"]}, {"w": "hideous", "t": 4, "at": "3:14", "pic": null, "means": "So ugly that it gives you a fright.", "ex": ["The story piles it on: ugly was not a strong enough word for the princess. Hideous was.", "A hideous mask at Halloween makes people jump."], "q": ["What would you put on a hideous face — warts? spots? Both?", "Which is worse, ugly or hideous?"]}, {"w": "court", "t": 4, "at": "3:44", "pic": null, "shift": true, "means": "Not a tennis court. A king's court means all the people who live and work around him — his helpers, his guards, his clever men.", "ex": ["Drosselmeyer asked the court astrologer what to do about the princess.", "You play tennis on a court too. Same word, completely different thing."], "q": ["Would you find a king in a tennis court?", "Who else might be in a king's court?"]}, {"w": "precious", "t": 5, "at": "0:15", "pic": null, "means": "So special to you that you would hate to lose it.", "ex": ["The Mouse King threatened to bite the head off “your precious nutcracker” — and he was right, it was precious to her now it was broken.", "Something can be precious even if it is old and scruffy."], "q": ["What is the most precious thing you own?", "Why did the nutcracker become more precious after it broke, not less?"]}, {"w": "ingenious", "t": 5, "at": "0:15", "pic": null, "means": "So clever at making things that you can work almost anything out.", "ex": ["The Mouse King sneered that not even her ingenious godfather could find the head once he had hidden it.", "Drosselmeyer really is ingenious — he is the one who built the clockwork and mended the nutcracker."], "q": ["Who is the most ingenious person you know?", "The Mouse King said it as an insult. Was it true anyway?"]}, {"w": "demanded", "t": 5, "at": "0:43", "pic": null, "means": "Asked for something in a way that was not really asking.", "ex": ["The Mouse King ate every sweet in the house and then demanded more.", "He would never say how much would be enough. He just kept telling her to bring more."], "q": ["What is the difference between asking for a biscuit and demanding one?", "Could you demand something from me? What would I say?"]}, {"w": "pantry", "t": 5, "at": "0:50", "pic": null, "means": "The little cupboard room where all the food is kept.", "ex": ["Clara went down to the pantry in the dark and fetched cake, Christmas pudding and the new biscuits.", "A pantry is cool and dark, which is why food keeps in it."], "q": ["If we had a pantry, what would you hide at the back of it?", "Is a fridge a pantry?"]}, {"w": "inventor", "t": 4, "at": "1:11", "pic": null, "means": "Somebody who makes a thing that has never existed before — nobody has made one until they do.", "ex": ["The king summoned Drosselmeyer, his inventor, who had built all sorts of wonders for him.", "He is the same man who is a clockmaker in track 1. Inventing and clockwork are his whole job."], "q": ["What would you invent to make mornings easier?", "Is somebody who builds a house from a plan an inventor?"]}], "title": "The Nutcracker", "blurb": "Twenty-six words to meet before the story, from rodent and waistcoat to ingenious and nincompoop.", "crumb": {"title": "Word cards", "href": "../"}, "credits": []};

  const rows = Object.keys(byTrack).sort((a, b) => a - b).map(t =>
    '<div class="trk"><span class="n">Track ' + t + '</span><span class="ws">'
    + byTrack[t].map(i => '<a href="#' + encodeURIComponent(W[i].w) + '">' + esc(W[i].w) + '</a>').join("")
    + '</span></div>').join("");

  stage.innerHTML =
    (D.crumb && D.crumb.title
      ? '<p class="crumb"><a href="' + D.crumb.href + '">' + esc(D.crumb.title) + '</a></p>' : "")
    + '<h1>' + esc(D.title) + '</h1>'
    + '<p class="blurb">' + esc(D.blurb) + '</p>'
    + '<p class="note">Words a young child is unlikely to know yet, taken from this book. '
    + 'Each one has a plain explanation, two examples and two questions to ask. '
    + 'Three or four at a time is plenty &mdash; and the words for a chapter are best met '
    + 'shortly before that chapter is heard.</p>'
    + '<div class="toc">' + rows + '</div>'
    + '<button class="start" id="begin">Start at the beginning</button>';
  document.getElementById("begin").onclick = () => show(0);
  nav.hidden = true;
  document.title = D.title + " — word cards";
  scrollTo({top: 0, behavior: "instant"});
}

function show(n) {
  const i = (n + W.length) % W.length;
  const w = W[i];
  stage.innerHTML =
    '<article class="card">'
    + (w.img ? '<img src="' + w.img + '" alt="' + esc(w.w) + '">' : "")
    + '<div class="pad">'
    + '<p class="where">Track ' + w.t + ' &middot; ' + w.at + '</p>'
    + '<h2 class="word">' + esc(w.w) + '</h2>'
    + (w.shift ? '<span class="shift">two meanings</span>' : "")
    + '<h3>What it means</h3><p class="means">' + esc(w.means) + '</p>'
    + '<h3>Like this</h3><ul class="ex"><li>' + w.ex.map(esc).join("</li><li>") + '</li></ul>'
    + '<div class="ask"><h3>Ask her</h3><ul><li>' + w.q.map(esc).join("</li><li>") + '</li></ul></div>'
    + '</div></article>';
  document.getElementById("count").textContent = (i + 1) + " / " + W.length;
  nav.hidden = false;
  document.title = w.w + " — " + D.title;
  if (decodeURIComponent(location.hash.slice(1)) !== w.w) location.hash = encodeURIComponent(w.w);
  current = i;
  scrollTo({top: 0, behavior: "instant"});
}

let current = -1;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const i = W.findIndex(w => w.w === h);
  if (i < 0) { current = -1; home(); } else if (i !== current) show(i);
}
document.getElementById("next").onclick = () => show(current + 1);
document.getElementById("home").onclick = () => { location.hash = ""; home(); };
addEventListener("hashchange", route);
addEventListener("keydown", e => {
  if (current < 0) return;
  if (e.key === "ArrowRight") show(current + 1);
  if (e.key === "ArrowLeft") show(current - 1);
  if (e.key === "Escape") { location.hash = ""; home(); }
});

if (D.credits && D.credits.length) {
  document.getElementById("credits").innerHTML =
    "<h2>Photographs</h2><ul>" + D.credits.map(c =>
      '<li><a href="' + c.page + '">' + esc(c.title) + '</a> &middot; '
      + esc(c.credit || "unknown") + ' &middot; ' + esc(c.licence) + '</li>').join("")
    + '</ul><p class="note">Reused from Wikimedia Commons under the licences named. '
    + 'The words, examples and questions on this page are free to use.</p>';
}
route();
</script>
</body>
</html>
