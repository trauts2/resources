<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dee2d7">
<title>Word cards</title>
<style>
 *,*::before,*::after{box-sizing:border-box}
 :root{
   --ground:#dee2d7;--ground-2:#cdd3c5;--on-ground:#262b2c;--soft:#5b6461;
   --rule:rgba(38,43,44,.16);--paper:#fcf9f2;--ink:#23282a;--rosette:#ad2f3b;--slate:#47606b;
   --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
   --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
   --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 }
 @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
   --ground:#15191b;--ground-2:#1e2427;--on-ground:#e4e8e3;--soft:#99a3a0;
   --rule:rgba(228,232,227,.18);--paper:#ece7db;--rosette:#bd3743;--slate:#40585f;}}
 :root[data-theme="dark"]{
   --ground:#15191b;--ground-2:#1e2427;--on-ground:#e4e8e3;--soft:#99a3a0;
   --rule:rgba(228,232,227,.18);--paper:#ece7db;--rosette:#bd3743;--slate:#40585f;}
 body{margin:0;background:var(--ground);color:var(--on-ground);font-family:var(--ui);
      line-height:1.55;-webkit-font-smoothing:antialiased;padding:44px 20px 60px}
 .wrap{max-width:620px;margin:0 auto}
 h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);margin:0 0 10px;letter-spacing:-.025em}
 .blurb{font-family:var(--serif);font-size:clamp(17px,2.6vw,19px);margin:0 0 34px;color:var(--on-ground)}
 ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
 a.card{display:block;background:var(--paper);color:var(--ink);border-radius:16px;
   padding:20px 22px;text-decoration:none;transition:transform .12s}
 a.card:hover{transform:translateY(-2px)}
 a.card:focus-visible{outline:2px solid var(--rosette);outline-offset:3px}
 a.card h2{font-family:var(--display);font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
 a.card p{margin:0;font-size:15px;color:#6a716e}
 a.card .n{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;
   letter-spacing:.11em;text-transform:uppercase;color:#fff;background:var(--rosette);
   padding:4px 10px;border-radius:999px}
 .crumb{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
 .crumb a{color:var(--soft);text-decoration:none}
 .crumb a:hover{color:var(--rosette)}
 footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--rule);
   font-size:13px;color:var(--soft)}
</style>
</head>
<body>

<div class="wrap">
  <p class="crumb" id="crumb"></p>
  <h1 id="title"></h1>
  <p class="blurb" id="blurb"></p>
  <ul id="list"></ul>
  <footer id="foot"></footer>
</div>
<script>

n the card already points here.", "meta": "TBD"}, {"href": "mth-30-haunted-castle-on-hallows-eve/", "title": "Magic Tree House 30: Haunted Castle on Hallows Eve", "blurb": "Not written yet — the code on the card already points here.", "meta": "TBD"}, {"href": "mth-31-summer-of-the-sea-serpent/", "title": "Magic Tree House 31: Summer of the Sea Serpent", "blurb": "Not written yet — the code on the card already points here.", "meta": "TBD"}, {"href": "mth-32-winter-of-the-ice-wizard/", "title": "Magic Tree House 32: Winter of the Ice Wizard", "blurb": "Not written yet — the code on the card already points here.", "meta": "TBD"}, {"href": "winnie-the-pooh/", "title": "Winnie-the-Pooh", "blurb": "Not written yet — the code on the card already points here.", "meta": "TBD"}]};
document.getElementById("title").textContent = D.title;
document.title = D.crumb ? D.title + " \u2014 " + D.crumb.title : D.title;

if (D.crumb) document.getElementById("crumb").innerHTML =
  '<a href="' + D.crumb.href + '">' + D.crumb.title + '</a>';
document.getElementById("list").innerHTML = D.entries.map(e =>
  '<li><a class="card" href="' + e.href + '"><h2>' + e.title + '</h2><p>' + e.blurb +
  '</p><span class="n">' + e.meta + '</span></a></li>').join("");
document.getElementById("foot").textContent = D.footer;
</script>

</body>
</html>
